[pytest]
markers =
    ros2: requires a real ROS2 (rclpy) installation. Automatically skipped
        via pytest.importorskip when rclpy is unavailable (this dev
        environment has none -- see README "Step 9" limitations).
        Run with: pytest -m "not ros2"   (pure-Python suite, default CI)
                  pytest -m ros2         (ROS2 integration suite; needs ROS2)
